[package]
name = "roguemetry"
description = "Geometry utils for 2D tile-based games"
license = "MIT"
homepage = "https://github.com/Tairesh/roguemetry"
repository = "https://github.com/Tairesh/roguemetry"
readme = "README.md"
version = "0.4.1"
edition = "2021"

[dependencies]
vek = { version = "0.17", default-features = false }
line_drawing = { version = "1.0" }
num-traits = { version = "0.2", default-features = false, features = ["std"] }
rand = { version = "0.10", optional = true }
serde = { version = "1.0", optional = true, features = ["derive"] }

[dev-dependencies]
bracket-pathfinding = "=0.8.7"
rand = "0.10"

[features]
default = ["rand", "serde"]
rand = ["dep:rand"]
serde = ["dep:serde"]
